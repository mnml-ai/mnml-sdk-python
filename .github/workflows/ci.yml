name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-latest is now 26.04, which has no Python 3.9 build; 24.04 still has one.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: mypy
      - run: ruff check . && ruff format --check .
        if: matrix.python == '3.13'
      - run: python -m build
        if: matrix.python == '3.13'
